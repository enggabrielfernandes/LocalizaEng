<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalizaEng | Encontre sua sala</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
            <h1>Localiza<span>Eng</span></h1>
        </div>
    </header>

    <main class="container">
        <section class="map-section">
            <div class="map-wrapper">
                <img src="pngcaminhos.png" alt="Mapa do Prédio da Engenharia" id="campus-map">
            </div>
        </section>

        <section class="controls-section">
            <div class="card">
                <h2>Traçar Rota</h2>
                <p>Selecione sua localização atual e a sala de destino.</p>
                
                <form id="route-form">
                    <div class="input-group">
                        <label for="origin">Onde você está?</label>
                        <div class="select-wrapper">
                            <select id="origin" required>
                                <option value="" disabled selected>Escolha a sala de origem</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="destination">Para onde vai?</label>
                        <div class="select-wrapper">
                            <select id="destination" required>
                                <option value="" disabled selected>Escolha a sala de destino</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                        Traçar Caminho
                    </button>
                </form>
            </div>

            <div id="result-card" class="card result-card hidden">
                <h3>Sua Rota</h3>
                <ul id="instructions-list">
                    </ul>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
